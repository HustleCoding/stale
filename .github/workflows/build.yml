name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build CLI + app (universal, ad-hoc signed)
        run: make VERSION="$VERSION"

      - name: Smoke-test CLI
        run: |
          ./build/stale --help
          ./build/stale --json "$RUNNER_TEMP" | head -c 400

      - name: Verify bundle
        run: make verify

      - name: Package
        run: make dist VERSION="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Stale
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
