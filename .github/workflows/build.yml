name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build CLI + app (universal, ad-hoc signed)
        run: make VERSION="$VERSION"

      - name: Smoke-test CLI
        run: |
          ./build/stale --help
          ./build/stale --json "$RUNNER_TEMP" | head -c 400

      - name: Verify bundle
        run: make verify

      - name: Package
        run: make dist VERSION="$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: Stale-adhoc
          path: dist/*

  # Signed + notarized release. Runs on v* tags when the signing secrets exist:
  #   MACOS_CERTIFICATE_P12       base64 of the "Developer ID Application" .p12 export
  #   MACOS_CERTIFICATE_PASSWORD  password used when exporting the .p12
  #   APPLE_ID                    Apple ID e-mail of the developer account
  #   APPLE_TEAM_ID               10-character team id (shown in the certificate name)
  #   APPLE_APP_PASSWORD          app-specific password from appleid.apple.com (for notarytool)
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the bundle version is the commit count; Sparkle compares it

      - name: Pick version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Check signing secrets
        id: secrets
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APP_PW: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -n "$P12" && -n "$APPLE_ID" && -n "$TEAM" && -n "$APP_PW" ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets missing — publishing ad-hoc signed artifacts (Gatekeeper will warn)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer ID certificate
        if: steps.secrets.outputs.signed == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          test -n "$IDENTITY" || { echo "No 'Developer ID Application' identity in the .p12"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Store notarytool credentials
        if: steps.secrets.outputs.signed == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials stale --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Build, sign, notarize, staple
        if: steps.secrets.outputs.signed == 'true'
        run: |
          make VERSION="$VERSION" SIGN_IDENTITY="$SIGN_IDENTITY"
          make notarize VERSION="$VERSION" SIGN_IDENTITY="$SIGN_IDENTITY"
          make verify

      - name: Build (ad-hoc fallback)
        if: steps.secrets.outputs.signed != 'true'
        run: make dist VERSION="$VERSION"

      # Sparkle update feed. SPARKLE_ED_PRIVATE_KEY is the key exported with
      # `generate_keys -x`; its public half is SPARKLE_PUBLIC_KEY in the Makefile.
      # The feed is served from the latest release: releases/latest/download/appcast.xml.
      - name: Sparkle appcast
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_KEY" ]]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY missing — no update feed; installed copies won't see this release."
            exit 0
          fi
          ZIP="dist/Stale-$VERSION.zip"
          KEYFILE="$RUNNER_TEMP/sparkle.key"
          printf '%s' "$SPARKLE_KEY" > "$KEYFILE"
          SIG=$(build/Sparkle-*/bin/sign_update --ed-key-file "$KEYFILE" -p "$ZIP")
          rm -f "$KEYFILE"
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" build/Stale.app/Contents/Info.plist)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Stale-$VERSION.zip"
          cat > dist/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Stale</title>
              <item>
                <title>Stale $VERSION</title>
                <link>https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}</link>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>12.0</sparkle:minimumSystemVersion>
                <pubDate>$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <enclosure url="$URL" length="$(stat -f%z "$ZIP")" type="application/octet-stream" sparkle:edSignature="$SIG"/>
              </item>
            </channel>
          </rss>
          XML
          cat dist/appcast.xml

      - name: Checksums
        run: (cd dist && shasum -a 256 Stale-*.zip Stale-*.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Remove signing keychain
        if: always() && steps.secrets.outputs.signed == 'true'
        run: security delete-keychain "$KEYCHAIN" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Stale-release
          path: dist/*

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ${{ steps.secrets.outputs.signed == 'true' && 'Signed with Developer ID and notarized by Apple — opens without Gatekeeper warnings.' || 'Ad-hoc signed build (not notarized): right-click → Open on first launch, or `xattr -d com.apple.quarantine Stale.app`.' }}
